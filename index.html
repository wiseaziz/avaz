<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AVAZ: worker housing. Search, book and rate beds, rooms and apartments in Arabic, English, Urdu, Filipino and Hindi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AVAZ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AVAZ</title>
<meta name="theme-color" content="#0D6352">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: mobile-first app shell. Phones get a bottom tab bar; from 960px a start-side rail and a wider grid.
   One bold device only: the reflective safety-vest tape (amber / silver / amber) used on the logo, header edge and hero. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#12222A; --muted:#566868; --line:#D4DCD8;
  --palm:#0D6352; --on-palm:#FFFFFF; --palm-tint:#DDEDE7; --vis:#F2A516; --on-vis:#2E1F00; --silver:#DCE3E6;
  --good:#1D7F45; --good-tint:#DDF0E4; --warn:#9A5B00; --warn-tint:#FBEBCF; --bad:#B8362A; --bad-tint:#F8DEDA; --star:#EE9F0C;
  --band:#0D6352; --on-band:#FFFFFF; --scrim:rgba(10,20,24,.48); --shadow:0 1px 2px rgba(18,34,42,.07),0 8px 22px rgba(18,34,42,.07);
  --f-body:"Readex Pro","Noto Naskh Arabic","Noto Sans Devanagari",system-ui,sans-serif;
  --f-display:"Lalezar","Readex Pro",system-ui,sans-serif;
  --f-mark:"Readex Pro",system-ui,sans-serif;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --t-xs:12px; --t-s:13.5px; --t-m:15px; --t-l:17px; --t-xl:21px; --t-2xl:27px; --t-3xl:36px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1517; --surface:#152024; --surface-2:#1A272B; --ink:#E5EEEB; --muted:#93A6A4; --line:#26363A;
  --palm:#45B997; --on-palm:#052018; --palm-tint:#173029; --vis:#F5B43A; --on-vis:#2A1B00; --silver:#3A4A50;
  --good:#5BC98A; --good-tint:#16301F; --warn:#E7A748; --warn-tint:#33270F; --bad:#F07565; --bad-tint:#3A1C18; --star:#F5B43A;
  --band:#0F3F36; --on-band:#EAF4F0; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1517; --surface:#152024; --surface-2:#1A272B; --ink:#E5EEEB; --muted:#93A6A4; --line:#26363A;
  --palm:#45B997; --on-palm:#052018; --palm-tint:#173029; --vis:#F5B43A; --on-vis:#2A1B00; --silver:#3A4A50;
  --good:#5BC98A; --good-tint:#16301F; --warn:#E7A748; --warn-tint:#33270F; --bad:#F07565; --bad-tint:#3A1C18; --star:#F5B43A;
  --band:#0F3F36; --on-band:#EAF4F0; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
:root[lang="ur"]{--f-body:"Noto Naskh Arabic","Readex Pro",system-ui,sans-serif; --f-display:"Noto Naskh Arabic","Readex Pro",system-ui,sans-serif}
:root[lang="hi"]{--f-body:"Noto Sans Devanagari","Readex Pro",system-ui,sans-serif; --f-display:"Noto Sans Devanagari","Readex Pro",system-ui,sans-serif}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:var(--t-m);line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:root[lang="ur"] body{line-height:1.8}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.num,.tab-num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--vis);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{min-height:100%}
.main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1120px;margin-inline:auto;width:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:58px;padding-block:8px}
.topbar .grow{flex:1;min-width:0}
.tape{height:6px;background:linear-gradient(var(--vis) 0 28%,var(--silver) 28% 72%,var(--vis) 72%)}
.mark{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mark);font-weight:700;letter-spacing:.08em;font-size:19px;color:var(--ink);text-decoration:none;direction:ltr}
.proto{font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--warn-tint);color:var(--warn);white-space:nowrap}

.tabbar{position:fixed;inset:auto 0 0 0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;max-width:640px;margin-inline:auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border:0;background:none;color:var(--muted);font-size:11.5px;position:relative;min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-current="page"]{color:var(--palm);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;border-radius:0 0 3px 3px;background:var(--vis)}
.tab .dot{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;line-height:17px;font-weight:600}
.rail{display:none}
@media (min-width:960px){
  .shell.has-nav{display:grid;grid-template-columns:232px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:20px 14px;border-inline-end:1px solid var(--line);background:var(--surface)}
  .rail .mark{padding:6px 10px 18px}
  .rail .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:var(--t-m);padding:11px 12px;border-radius:12px}
  .rail .tab[aria-current="page"]{background:var(--palm-tint)}
  .rail .tab[aria-current="page"]::before{top:10px;bottom:10px;inset-inline:0 auto;width:3px;height:auto;border-radius:3px}
  .rail .tab .dot{position:static;margin-inline-start:auto}
  .tabbar{display:none}
  .main{padding-bottom:40px}
  .topbar .mark{display:none}
}

/* ---------- buttons, chips, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:var(--t-m);text-decoration:none;transition:transform .12s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--palm);border-color:var(--palm);color:var(--on-palm)}
.btn.vis{background:var(--vis);border-color:var(--vis);color:var(--on-vis)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--palm)}
.btn.danger{color:var(--bad);border-color:var(--bad-tint);background:var(--bad-tint)}
.btn.sm{min-height:36px;padding:0 12px;font-size:var(--t-s);border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none}
.iconbtn.flat{border-color:transparent;background:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:var(--t-s);white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.sm{min-height:30px;padding:0 10px;font-size:var(--t-xs)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.label{font-size:var(--t-s);font-weight:600;color:var(--ink)}
.hint{font-size:var(--t-xs);color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
textarea.input{min-height:110px;resize:vertical;line-height:1.6}
.input:focus{border-color:var(--palm);box-shadow:0 0 0 3px var(--palm-tint)}
.search{position:relative}
.search .input{padding-inline-start:44px;min-height:52px;border-radius:14px;background:var(--surface)}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.muted{color:var(--muted)}
.small{font-size:var(--t-s)}
.xs{font-size:var(--t-xs)}
.b{font-weight:600}
.sec{display:flex;flex-direction:column;gap:14px;padding-block:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:var(--t-xl);letter-spacing:.01em}
:root[lang="ur"] .sec-h h2,:root[lang="hi"] .sec-h h2{font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.divider{height:1px;background:var(--line);border:0;margin:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:var(--t-xs);font-weight:600;white-space:nowrap;line-height:1.5}
.pill.good{background:var(--good-tint);color:var(--good)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.palm{background:var(--palm-tint);color:var(--palm)}
.pill.ink{background:var(--ink);color:var(--surface)}
.pill.vis{background:var(--vis);color:var(--on-vis)}

/* ---------- stars & rings ---------- */
.stars{display:inline-flex;gap:1px;color:var(--star);vertical-align:-2px}
.stars .e{color:var(--line)}
.rate{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-s)}
.rate b{font-variant-numeric:tabular-nums}
.ring{--p:70;--c:var(--palm);width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring>i{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.ring.lg{width:84px;height:84px}
.ring.lg>i{width:68px;height:68px;font-size:22px}
.ring small{display:block;font-size:9.5px;font-weight:500;color:var(--muted);margin-top:2px}

/* ---------- listing cards ---------- */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:start;padding:0;transition:transform .15s ease,box-shadow .15s ease}
.lcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.lmedia{position:relative;aspect-ratio:16/10;background:var(--surface-2);overflow:hidden;max-width:100%}
.lmedia>img,.lmedia>video,.lmedia>svg{width:100%;height:100%;object-fit:cover}
.lmedia .heart{position:absolute;top:10px;inset-inline-end:10px;width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#12222A}
.lmedia .heart[aria-pressed="true"]{color:#D23B4E}
.lmedia .badges{position:absolute;top:10px;inset-inline-start:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.lmedia .count{position:absolute;bottom:10px;inset-inline-end:10px;background:rgba(10,20,24,.7);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px;display:flex;gap:5px;align-items:center}
.lbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.lbody h3{font-size:var(--t-l);font-weight:600;line-height:1.3}
.ltop{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ltop>div{min-width:0}
.lprice{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.lprice b{font-size:var(--t-xl);font-weight:700;font-variant-numeric:tabular-nums}
.lamen{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted)}
.lamen span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface-2)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:min(84%,340px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;padding-bottom:6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
@media (min-width:960px){.hscroll{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));overflow:visible;margin:0;padding:0}}

/* ---------- explore hero band ---------- */
.band{background:var(--band);color:var(--on-band);position:relative;overflow:hidden}
.band-in{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;padding-block:18px 0}
.band h1{font-family:var(--f-display);font-weight:400;font-size:var(--t-2xl);line-height:1.15}
:root[lang="ur"] .band h1,:root[lang="hi"] .band h1{font-weight:700;font-size:var(--t-xl)}
.band p{opacity:.9;font-size:var(--t-s)}
.band .art{flex:none;width:min(46%,300px);align-self:flex-end}
.band-copy{padding-bottom:18px;min-width:0;display:flex;flex-direction:column;gap:6px}

/* ---------- welcome ---------- */
.welcome{min-height:100%;display:flex;flex-direction:column}
.w-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.w-hero{background:var(--band);color:var(--on-band);border-radius:0 0 28px 28px;overflow:hidden;position:relative}
.w-hero-in{display:grid;gap:18px;padding-block:22px 0}
.w-hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,7vw,52px);line-height:1.1;max-width:16ch}
:root[lang="ur"] .w-hero h1,:root[lang="hi"] .w-hero h1{font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1.4}
.w-hero p{max-width:52ch;opacity:.92}
.w-art{margin-inline:-16px}
@media (min-width:860px){.w-hero-in{grid-template-columns:1fr 1.1fr;align-items:end}.w-art{margin:0}.w-copy{padding-bottom:36px}}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;min-height:36px}
.lang[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lang[lang="ur"]{font-family:"Noto Naskh Arabic",serif}
.lang[lang="hi"]{font-family:"Noto Sans Devanagari",sans-serif}
.roles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.role{display:flex;gap:14px;align-items:center;text-align:start;padding:16px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);transition:border-color .15s,transform .15s}
.role:hover{border-color:var(--palm);transform:translateY(-2px)}
.role .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.role b{display:block;font-size:var(--t-l)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.feat>div{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-m);background:var(--surface-2)}
.feat .fi{width:36px;height:36px;border-radius:10px;background:var(--palm-tint);color:var(--palm);display:grid;place-items:center;flex:none}
.people{display:grid;grid-auto-flow:column;grid-auto-columns:128px;gap:12px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:6px;scrollbar-width:thin}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line)}
.person>svg{width:84px;height:84px}
.person b{font-size:var(--t-s)}
.flag{display:inline-block;width:20px;height:14px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.12);vertical-align:-2px;flex:none}
.flag svg{width:100%;height:100%}

/* ---------- detail ---------- */
.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--surface-2);height:min(62.5vw,440px);width:100%}
.gallery::-webkit-scrollbar{display:none}
.gallery>*{scroll-snap-align:center;width:100%;height:100%;object-fit:cover;background:#0b1214}
.gal-wrap{position:relative}
.gal-wrap .floaty{position:absolute;top:12px;display:flex;gap:8px}
.gal-wrap .floaty.s{inset-inline-start:max(12px,env(safe-area-inset-left,0px))}
.gal-wrap .floaty.e{inset-inline-end:max(12px,env(safe-area-inset-right,0px))}
.gal-wrap .floaty .iconbtn{background:rgba(255,255,255,.94);border-color:transparent;color:#12222A}
.gal-wrap .gcount{position:absolute;bottom:12px;inset-inline-end:12px;background:rgba(10,20,24,.72);color:#fff;font-size:12px;padding:3px 10px;border-radius:99px}
.dgrid{display:grid;gap:18px;padding-block:18px}
@media (min-width:960px){.dgrid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.dgrid aside{position:sticky;top:84px}.gal-wrap{border-radius:0 0 22px 22px;overflow:hidden}}
.dtitle h1{font-size:var(--t-2xl);font-family:var(--f-display);font-weight:400;line-height:1.2}
:root[lang="ur"] .dtitle h1,:root[lang="hi"] .dtitle h1{font-weight:700;font-size:var(--t-xl)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.aitem{display:flex;gap:10px;align-items:center;font-size:var(--t-s);padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.aitem svg{color:var(--palm);flex:none}
.beds{display:flex;flex-wrap:wrap;gap:4px}
.beds i{width:16px;height:22px;border-radius:4px;background:var(--line)}
.beds i.f{background:var(--palm)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-xs);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:14px;border-radius:3px;display:inline-block}
.reasons{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.reasons li{display:flex;gap:10px;align-items:flex-start;font-size:var(--t-s)}
.reasons .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.reasons .ok .mk{background:var(--good-tint);color:var(--good)}
.reasons .no .mk{background:var(--warn-tint);color:var(--warn)}
.reasons .bad .mk{background:var(--bad-tint);color:var(--bad)}
.gauge{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--good-tint),var(--palm-tint) 50%,var(--warn-tint));margin-block:26px 22px}
:root[dir="rtl"] .gauge{background:linear-gradient(270deg,var(--good-tint),var(--palm-tint) 50%,var(--warn-tint))}
.gauge .mkr{position:absolute;top:50%;width:4px;height:24px;border-radius:2px;transform:translate(-50%,-50%);background:var(--ink)}
:root[dir="rtl"] .gauge .mkr{transform:translate(50%,-50%)}
.gauge .mkr b{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.gauge .mkr.mkt{background:var(--muted);width:2px;height:18px}
.gauge .mkr.mkt b{bottom:auto;top:calc(100% + 4px);font-weight:400;color:var(--muted)}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:10px;align-items:center;font-size:var(--t-s)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--palm);border-radius:99px}
.bar.vis>i{background:var(--vis)}
.review{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.review:first-child{border-top:0;padding-top:0}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;overflow:hidden;background:var(--surface-2)}
.avatar svg{width:100%;height:100%}
.avatar.lg{width:72px;height:72px}
.avatar.xl{width:96px;height:96px}
.reply{margin-inline-start:16px;padding:10px 12px;border-inline-start:3px solid var(--vis);background:var(--surface-2);border-radius:0 10px 10px 0;font-size:var(--t-s)}
:root[dir="rtl"] .reply{border-radius:10px 0 0 10px}
.ltag{font-size:10.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.bookbar{position:fixed;inset:auto 0 0 0;z-index:34;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.bookbar .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between}
@media (min-width:960px){.bookbar{display:none}}
.pricebox b{font-size:var(--t-2xl);font-variant-numeric:tabular-nums}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.scrim.enter{animation:fade .18s ease}.scrim.enter .sheet{animation:up .22s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 0 0}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 4px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 10px;position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-h h2{font-size:var(--t-xl);font-family:var(--f-display);font-weight:400}
:root[lang="ur"] .sheet-h h2,:root[lang="hi"] .sheet-h h2{font-weight:700;font-size:var(--t-l)}
.sheet-f{position:sticky;bottom:0;background:var(--surface);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;margin-top:14px}
.sheet-pad{height:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;max-height:88vh}.sheet .grab{display:none}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.starpick{display:flex;gap:4px;direction:ltr}
:root[dir="rtl"] .starpick{direction:rtl}
.starpick button{border:0;background:none;padding:3px;color:var(--line)}
.starpick button.on{color:var(--star)}
.critrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;border-bottom:1px solid var(--line)}
.critrow:last-child{border-bottom:0}
.overall{display:flex;align-items:center;gap:16px;padding:14px;border-radius:16px;background:var(--surface-2)}
.overall .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.err{color:var(--bad);font-size:var(--t-s)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:var(--surface-2);font-size:20px}
.stepper output{min-width:46px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:12px;font-size:var(--t-s)}
.rules li b{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--vis);color:var(--on-vis);font-size:12px}

/* ---------- bookings / requests ---------- */
.bk{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line)}
.bk .th{width:96px;height:96px;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.bk .th>*{width:100%;height:100%;object-fit:cover}
.bk .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.req{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line)}
.ai{border-radius:14px;padding:12px;background:var(--palm-tint);display:flex;flex-direction:column;gap:6px;font-size:var(--t-s)}
.ai-h{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--palm)}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:var(--t-2xl);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:var(--t-xs);color:var(--muted)}
.dash2{display:grid;gap:14px}
@media (min-width:900px){.dash2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:var(--t-s)}
.hbar .nm{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .pc{text-align:end;font-variant-numeric:tabular-nums;color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:18px}
.hist>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.hist i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--palm);opacity:.8;position:relative}
.hist i.me{background:var(--vis);opacity:1}
.hist span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hist .val{font-size:10.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.ulist{display:flex;flex-direction:column;gap:12px}
.unit{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:12px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line)}
.unit .th{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface-2);max-width:100%}
.unit .th>*{width:100%;height:100%;object-fit:cover}
.unit .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{display:flex;gap:10px;align-items:flex-start;font-size:var(--t-s)}
.tips li::before{content:"";width:8px;height:8px;margin-top:7px;border-radius:2px;background:var(--vis);flex:none;transform:rotate(45deg)}

/* ---------- forms (owner editor, register) ---------- */
.form{display:flex;flex-direction:column;gap:16px;padding-block:18px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.mtile{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface-2);max-width:100%}
.mtile>img,.mtile>video,.mtile>svg{width:100%;height:100%;object-fit:cover}
.mtile .x{position:absolute;top:6px;inset-inline-end:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(10,20,24,.75);color:#fff;display:grid;place-items:center}
.mtile .kind{position:absolute;bottom:6px;inset-inline-start:6px;background:rgba(10,20,24,.75);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:99px}
.drop{aspect-ratio:1;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;padding:8px;color:var(--muted);font-size:var(--t-xs);cursor:pointer;background:var(--surface)}
.drop:hover{border-color:var(--palm);color:var(--palm)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.switch input:checked+i{background:var(--palm)}
.switch input:checked+i::after{inset-inline-start:23px}
.avpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.avpick button{border:2px solid transparent;border-radius:18px;background:var(--surface);padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px}
.avpick button>svg{width:66px;height:66px}
.avpick button[aria-pressed="true"]{border-color:var(--palm);background:var(--palm-tint)}
.qbox{position:static}
@media (min-width:960px){.qbox{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}.dgrid.ed aside{order:2}}
input[type=range]{width:100%;accent-color:var(--palm)}
.profile-h{display:flex;gap:16px;align-items:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:36px 16px;color:var(--muted)}
.empty>svg{width:150px;height:auto}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:80;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-size:var(--t-s);font-weight:500;opacity:0;pointer-events:none;transition:all .2s ease;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ai-out{white-space:pre-wrap}
.note{font-size:var(--t-xs);color:var(--muted);display:flex;gap:6px;align-items:center}

.grow{flex:1;min-width:0}
:root[dir="rtl"] .flip{transform:scaleX(-1)}
.st{position:relative;display:inline-block;flex:none}
.st>svg{position:absolute;inset:0;color:var(--line)}
.stf{position:absolute;inset-block:0;inset-inline-start:0;overflow:hidden;color:var(--star)}
.stf svg{position:absolute;top:0;inset-inline-start:0}
.hist .hb{flex:1;width:100%;display:flex;align-items:flex-end;min-height:0}
.bookside{display:none}
@media (min-width:960px){.bookside{display:block}}
.ai-h{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--palm)}
.role>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.panel>.review:first-child{padding-top:0}
.w-copy p{font-size:var(--t-l)}
@media (max-width:420px){.band .art{width:40%}.band h1{font-size:var(--t-xl)}}

.illus{position:relative;width:100%;height:100%}
.illus>svg{width:100%;height:100%}
.itag{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(10,20,24,.72);color:#fff;font-size:10.5px;padding:1px 8px;border-radius:99px;pointer-events:none}
.lmedia>.illus{width:100%;height:100%}
.avatar>img,.avatar>video,.avatar>.illus{width:100%;height:100%;object-fit:cover}
.avatar .itag,.bk .th .itag,.unit .th .itag{display:none}
.contact{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2);grid-column:1/-1;color:var(--palm)}
.contact a{color:var(--ink);text-decoration:none;font-size:var(--t-l);font-variant-numeric:tabular-nums}
.contact .btn{margin-inline-start:auto}
.auth{max-width:480px;margin-inline:auto;width:100%}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-block:40px}
.center .mark{font-size:26px}
body.busy{cursor:progress}
body.busy::after{content:"";position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:95;background:linear-gradient(90deg,transparent,var(--vis),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busybar 1.1s linear infinite}
@keyframes busybar{from{background-position:-40% 0}to{background-position:140% 0}}
.mtile .spin{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:6px;background:rgba(10,20,24,.5);color:#fff;font-size:11px}
.linkbtn{align-self:center;background:none;border:0;color:var(--palm);font-weight:600;padding:8px 4px;text-decoration:underline;text-underline-offset:3px;font-size:var(--t-s)}
.err:empty{display:none}
</style>

rule1:["يقيّم فقط من أكمل إقامة موثّقة عبر AVAZ.","Only people with a verified stay through AVAZ can rate.","صرف وہی ریٹ کر سکتے ہیں جن کا AVAZ کے ذریعے تصدیق شدہ قیام ہو۔","Tanging may beripikadong pananatili sa AVAZ ang makakapag-rate.","केवल AVAZ के ज़रिए पक्के ठहराव वाले ही रेटिंग दे सकते हैं।"],
rule2:["الطرفان يقيّمان خلال 14 يوماً، ويُنشر التقييمان معاً حتى لا يتأثر أحد بالآخر.","Both sides rate within 14 days. Both ratings are published together so neither sways the other.","دونوں فریق 14 دن میں ریٹ کرتے ہیں؛ دونوں ریٹنگز ایک ساتھ شائع ہوتی ہیں تاکہ کوئی دوسرے سے متاثر نہ ہو۔","Nagre-rate ang dalawang panig sa loob ng 14 araw; sabay na inilalathala para walang maimpluwensiyahan.","दोनों पक्ष 14 दिन में रेटिंग देते हैं; दोनों रेटिंग साथ प्रकाशित होती हैं ताकि कोई प्रभावित न हो।"],
rule3:["خمسة معايير إلزامية، والتقييم العام يُحسب منها تلقائياً.","Five required criteria. The overall score is calculated from them.","پانچ لازمی معیار؛ مجموعی اسکور انہی سے نکلتا ہے۔","Limang kailangang pamantayan; dito kinukuwenta ang kabuuan.","पाँच ज़रूरी मानक; कुल अंक इन्हीं से निकलते हैं।"],

rule5:["الرقم المعروض موزون إحصائياً، فالحساب الجديد لا يحصل على 5.0 من تقييم واحد.","The number shown is statistically weighted, so a new account can't reach 5.0 from one review.","دکھایا گیا نمبر شماریاتی وزن والا ہے، نیا اکاؤنٹ ایک جائزے سے 5.0 نہیں لے سکتا۔","Timbang ayon sa estadistika ang numero, kaya hindi aabot sa 5.0 ang bagong account mula sa isang review.","दिखाया गया नंबर सांख्यिकीय रूप से संतुलित है, नया अकाउंट एक समीक्षा से 5.0 नहीं पा सकता।"],
rule6:["تحت 3.0 يظهر تحذير، وتحت 2.5 بعد 5 تقييمات يُوقف الإعلان أو الحساب للمراجعة.","Below 3.0 shows a warning. Below 2.5 after 5 reviews, the listing or account is paused for review.","3.0 سے کم پر انتباہ؛ 5 جائزوں کے بعد 2.5 سے کم پر اشتہار یا اکاؤنٹ جانچ کے لیے روک دیا جاتا ہے۔","Babala kapag mababa sa 3.0; kapag mababa sa 2.5 matapos ang 5 review, ihihinto ang listing o account para suriin.","3.0 से नीचे चेतावनी; 5 समीक्षाओं के बाद 2.5 से नीचे लिस्टिंग या अकाउंट जाँच के लिए रोका जाता है।"],

function ic(name, size, cls){ size=size||20; return `<svg class="${cls||''}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[name]||''}</svg>`; }
const STAR_P = 'M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z';
function stars(v, size){
  size = size||14; let h='';
  for(let i=0;i<5;i++){
    let f = Math.max(0, Math.min(1, v-i)); f = f>=.75?1:(f>=.25?.5:0);
    h += `<span class="st" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 24 24" class="e"><path d="${STAR_P}" fill="currentColor"/></svg>${f?`<span class="stf" style="width:${f*100}%"><svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="${STAR_P}" fill="currentColor"/></svg></span>`:''}</span>`;
  }
  return `<span class="stars" aria-hidden="true">${h}</span>`;
}

    case 'bd': s=`<rect width="30" height="20" fill="#006A4E"/><circle cx="13.5" cy="10" r="5.4" fill="#F42A41"/>`; break;
    case 'np': s=`<rect width="30" height="20" fill="#fff"/><path d="M8 1L22 9.5H12L22 19H8Z" fill="#DC143C" stroke="#003893" stroke-width="1.2"/>`; break;
    case 'uk': s=`<rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#C8102E" stroke-width="1.5"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="6"/><path d="M15 0V20M0 10H30" stroke="#C8102E" stroke-width="3.4"/>`; break;
    default: s=`<rect width="30" height="20" fill="#CBD5D3"/>`;

  return `<span class="flag" title="${t('n_'+c)}"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice">${s}</svg></span>`;
}

/* ================= characters ================= */
let _uid = 0;
function avatarSVG(c){
  if(!c) c = {skin:'#C99068',hair:'#222',hs:'short',outfit:'#5D6D7A',wear:'shirt',bg:'#DDE7E4'};
  if(c.logo) return logoAvatar(c);
  const id = 'av'+(++_uid);
  const S = c.skin, H = c.hair, shade='rgba(0,0,0,.13)';
  let back='', body='', hair='', beard='', hat='', extra='';
  /* back hair (behind head) */
  if(c.hs==='long') back += `<path d="M35 58 C31 28 46 20 60 20 C74 20 89 28 85 58 L90 96 Q60 106 30 96 Z" fill="${H}"/>`;
  if(c.hs==='bun') back += `<circle cx="60" cy="21" r="10" fill="${H}"/>`;
  if(c.hat==='hijab') back += `<path d="M34 58 C30 26 46 16 60 16 C74 16 90 26 86 58 C86 78 74 90 60 92 C46 90 34 78 34 58 Z" fill="${c.hijab}"/>`;
  /* body */
  const bodyD = 'M12 124 C14 96 35 86 60 86 C85 86 106 96 108 124 Z';
  body += `<path d="M51 70 h18 v18 q-9 6 -18 0 z" fill="${S}"/><path d="M51 78 q9 6 18 0 v-6 h-18 z" fill="${shade}"/>`;
  body += `<path d="${bodyD}" fill="${c.outfit}" ${c.outfit==='#FFFFFF'?'stroke="#D6DCDE" stroke-width="1.5"':''}/>`;
  switch(c.wear){
    case 'vest':
      body += `<path d="M48 88 L60 99 L72 88 L66 86 L60 93 L54 86 Z" fill="rgba(255,255,255,.85)"/>`;
      body += `<path d="M12 124 C14 100 28 90 45 87 L50 124 Z" fill="${c.vest}"/><path d="M108 124 C106 100 92 90 75 87 L70 124 Z" fill="${c.vest}"/>`;
      body += `<path d="M15 104 L48 104 L49 110 L14 110 Z" fill="#E8EEF0"/><path d="M105 104 L72 104 L71 110 L106 110 Z" fill="#E8EEF0"/>`;
      break;
    case 'chef':
      body += `<path d="M46 88 Q60 95 74 88 L74 93 Q60 100 46 93 Z" fill="#E6EBED"/>`;
      body += [[53,102],[53,112],[67,102],[67,112]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.9" fill="#98A4A8"/>`).join('');
      break;
    case 'scrubs':
      body += `<path d="M50 87 L60 101 L70 87 Z" fill="${S}"/><path d="M49 87 L60 102 L71 87" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="2"/><rect x="72" y="104" width="12" height="9" rx="2" fill="rgba(255,255,255,.35)"/>`;
      break;
    case 'overalls':
      body += `<rect x="43" y="88" width="7" height="36" fill="${c.strap}"/><rect x="70" y="88" width="7" height="36" fill="${c.strap}"/><rect x="45" y="104" width="30" height="20" rx="3" fill="${c.strap}"/><circle cx="46.5" cy="100" r="2" fill="#E2C25B"/><circle cx="73.5" cy="100" r="2" fill="#E2C25B"/>`;
      break;
    case 'thobe':
      body += `<path d="M60 88 v20" stroke="#D6DCDE" stroke-width="1.5"/><circle cx="60" cy="96" r="1.4" fill="#C9D0D3"/><circle cx="60" cy="103" r="1.4" fill="#C9D0D3"/>`;
      break;
    default: /* shirt */
      body += `<path d="M47 88 L60 100 L73 88 L66 85 L60 93 L54 85 Z" fill="rgba(255,255,255,.82)"/><circle cx="60" cy="106" r="1.5" fill="rgba(0,0,0,.25)"/><circle cx="60" cy="115" r="1.5" fill="rgba(0,0,0,.25)"/>`;
  }
  if(c.hat==='hijab') body += `<path d="M30 124 C32 100 44 88 60 88 C76 88 88 100 90 124 Z" fill="${c.hijab}" opacity=".96"/>`;
  /* head */
  const head = `<circle cx="40" cy="55" r="5.5" fill="${S}"/><circle cx="80" cy="55" r="5.5" fill="${S}"/><ellipse cx="60" cy="52" rx="20" ry="23" fill="${S}"/>`;
  /* hair (front) */
  switch(c.hs){
    case 'short': hair = `<path d="M39 50 C37 30 49 23 61 23 C73 23 84 31 81 50 C79 41 72 35 60 35 C49 35 42 41 39 50 Z" fill="${H}"/>`; break;
    case 'side': hair = `<path d="M39 52 C36 28 52 22 62 23 C74 24 85 32 81 52 C80 44 75 38 68 36 C60 41 48 40 39 52 Z" fill="${H}"/>`; break;
    case 'curly': hair = `<path d="M39 50 C37 32 49 26 61 26 C73 26 84 32 81 50 C78 42 72 37 60 37 C49 37 42 42 39 50 Z" fill="${H}"/>` + [[42,41],[46,33],[54,28],[63,27],[71,30],[78,38]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="7.5" fill="${H}"/>`).join(''); break;
    case 'wavy': hair = `<path d="M38 52 C34 34 44 22 58 22 C66 18 78 24 80 32 C86 38 84 46 82 52 C80 44 76 40 70 38 C66 42 58 40 52 37 C46 40 41 45 38 52 Z" fill="${H}"/>`; break;
    case 'bun': case 'long': hair = `<path d="M39 52 C39 33 49 27 60 27 C71 27 81 33 81 52 C77 41 69 37 60 38 C51 37 43 41 39 52 Z" fill="${H}"/>`; break;
    default: hair = '';
  }
  /* face features */
  let face = `<path d="M46 46.5 q6 -4 11 -1" stroke="${H}" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M63 45.5 q5 -3 11 1" stroke="${H}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  face += `<circle cx="52" cy="54" r="2.6" fill="#1C1A19"/><circle cx="68" cy="54" r="2.6" fill="#1C1A19"/><circle cx="52.8" cy="53.2" r=".8" fill="#fff"/><circle cx="68.8" cy="53.2" r=".8" fill="#fff"/>`;
  face += `<path d="M60 56 q-3.5 6 .5 8" stroke="${shade}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  face += `<circle cx="47" cy="62" r="4" fill="rgba(220,90,90,.16)"/><circle cx="73" cy="62" r="4" fill="rgba(220,90,90,.16)"/>`;
  switch(c.beard){
    case 'full': beard = `<path d="M40 54 C40 78 51 88 60 88 C69 88 80 78 80 54 C78 63 74 70 69 71 C66 68 54 68 51 71 C46 70 42 63 40 54 Z" fill="${H}"/>`; break;
    case 'stubble': beard = `<path d="M40 54 C40 78 51 87 60 87 C69 87 80 78 80 54 C78 63 74 70 69 71 C66 68 54 68 51 71 C46 70 42 63 40 54 Z" fill="${H}" opacity=".26"/>`; break;
    case 'mustache': beard = `<path d="M51 63.5 C55 59.5 58 61 60 62 C62 61 65 59.5 69 63.5 C65 65.5 62 64.5 60 64 C58 64.5 55 65.5 51 63.5 Z" fill="${H}"/>`; break;
    case 'goatee': beard = `<path d="M54 72 C55 79 65 79 66 72 C63 74 57 74 54 72 Z" fill="${H}"/><path d="M52 63.5 C56 60 64 60 68 63.5 C64 65 56 65 52 63.5 Z" fill="${H}"/>`; break;
  }
  const mouthC = c.beard==='full' ? 'rgba(255,255,255,.7)' : (c.gender==='f'?'#A9474A':'#6E2E2B');
  const mouth = `<path d="M53.5 66.5 q6.5 5.5 13 0" stroke="${mouthC}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  if(c.glasses) extra += `<rect x="44.5" y="48.5" width="15" height="11" rx="4" fill="rgba(255,255,255,.12)" stroke="#2A2A2A" stroke-width="2"/><rect x="60.5" y="48.5" width="15" height="11" rx="4" fill="rgba(255,255,255,.12)" stroke="#2A2A2A" stroke-width="2"/>`;
  /* hats */
  switch(c.hat){
    case 'hardhat': hat = `<path d="M36 44 C36 25 47 17 60 17 C73 17 84 25 84 44 Z" fill="${c.hatC}"/><path d="M60 17.5 v26" stroke="rgba(0,0,0,.13)" stroke-width="5"/><rect x="31" y="41" width="58" height="7" rx="3.5" fill="${c.hatC}"/><rect x="31" y="45" width="58" height="3" rx="1.5" fill="rgba(0,0,0,.12)"/><path d="M44 31 q5 -8 13 -9" stroke="rgba(255,255,255,.55)" stroke-width="3" fill="none" stroke-linecap="round"/>`; break;

    case 'cap': hat = `<path d="M38 43 C38 27 48 20 60 20 C72 20 82 27 82 43 Z" fill="${c.hatC}"/><path d="M58 41 C70 39 90 40 97 46 C89 48.5 70 47.5 58 45.5 Z" fill="${c.hatC}"/><path d="M58 41 C70 39 90 40 97 46" stroke="rgba(0,0,0,.18)" stroke-width="1.5" fill="none"/><circle cx="60" cy="20.5" r="2.2" fill="rgba(0,0,0,.2)"/>`; break;
    case 'nurse': hat = `<path d="M43 33 L77 33 L72 21 L48 21 Z" fill="#fff" stroke="#D6DCDE" stroke-width="1.5"/><rect x="58.2" y="23" width="3.6" height="8" fill="#D64545"/><rect x="56" y="25.2" width="8" height="3.6" fill="#D64545"/>`; break;

  return `<svg viewBox="0 0 120 120" role="img" aria-label="${pn(c.name)||''}"><defs><clipPath id="${id}"><circle cx="60" cy="60" r="60"/></clipPath></defs><g clip-path="url(#${id})"><rect width="120" height="120" fill="${c.bg||'#DDE7E4'}"/>${back}${body}${head}${hair}${face}${beard}${mouth}${extra}${hat}</g></svg>`;

/* ================= Supabase client (plain fetch, no library) ================= */
const CFG = window.AVAZ_CONFIG || {};
const API = {
  url: String(CFG.url || '').trim().replace(/\/+$/, ''),
  key: String(CFG.key || '').trim(),
  session: null,
  ready(){ return /^https?:\/\//.test(this.url) && this.key.length > 20; },
  loadSession(){ try{ const s = JSON.parse(localStorage.getItem('avaz.session')||'null'); if(s && s.access_token && s.user) this.session = s; }catch(e){} },
  saveSession(s){ this.session = s; try{ if(s) localStorage.setItem('avaz.session', JSON.stringify(s)); else localStorage.removeItem('avaz.session'); }catch(e){} },
  uid(){ return this.session && this.session.user ? this.session.user.id : null; },
  async call(path, opt){
    let r;
    try{ r = await fetch(this.url + path, opt); }
    catch(e){ throw {code:'network', message:String(e && e.message || e)}; }
    const txt = await r.text(); let j = null;
    try{ j = txt ? JSON.parse(txt) : null; }catch(e){ j = {message: txt}; }
    if(!r.ok){ const err = Object.assign({status:r.status}, j || {}); if(!err.message) err.message = err.msg || err.error_description || err.error || ('HTTP '+r.status); throw err; }
    return j;
  },
  authHeaders(){ return {apikey:this.key, 'Content-Type':'application/json'}; },
  keep(j){
    if(!j || !j.access_token) return null;
    const s = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at || Math.floor(Date.now()/1000)+(j.expires_in||3600), user:{id:j.user.id, email:j.user.email}};
    this.saveSession(s); return s;
  },
  async signUp(email, password){
    const j = await this.call('/auth/v1/signup', {method:'POST', headers:this.authHeaders(), body:JSON.stringify({email, password})});
    if(!this.keep(j)) throw {code:'confirm_email', message:'confirm_email'};
  },
  async signIn(email, password){
    const j = await this.call('/auth/v1/token?grant_type=password', {method:'POST', headers:this.authHeaders(), body:JSON.stringify({email, password})});
    if(!this.keep(j)) throw {code:'invalid_credentials', message:'invalid_credentials'};
  },
  _refreshing: null,
  async refresh(){
    if(this._refreshing) return this._refreshing;
    this._refreshing = (async()=>{
      try{
        const j = await this.call('/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:this.authHeaders(), body:JSON.stringify({refresh_token:this.session.refresh_token})});
        if(!this.keep(j)) throw {code:'session_expired'};
      }catch(e){ if(e.code!=='network'){ this.saveSession(null); throw {code:'session_expired', message:'session_expired'}; } throw e; }
      finally{ this._refreshing = null; }
    })();
    return this._refreshing;
  },
  async token(){
    if(!this.session) throw {code:'session_expired', message:'session_expired'};
    if(Date.now()/1000 > (this.session.expires_at||0) - 90) await this.refresh();
    return this.session.access_token;
  },
  async signOut(){ try{ const tk = this.session && this.session.access_token; if(tk) await this.call('/auth/v1/logout', {method:'POST', headers:Object.assign(this.authHeaders(), {Authorization:'Bearer '+tk})}); }catch(e){} this.saveSession(null); },
  async rest(method, path, body, prefer, retried){
    const tk = await this.token();
    const h = {apikey:this.key, Authorization:'Bearer '+tk, 'Content-Type':'application/json'};
    if(prefer) h.Prefer = prefer;
    try{ return await this.call('/rest/v1/'+path, {method, headers:h, body: body===undefined?undefined:JSON.stringify(body)}); }
    catch(e){ if(e.status===401 && !retried){ await this.refresh(); return this.rest(method, path, body, prefer, true); } throw e; }
  },
  get(path){ return this.rest('GET', path); },
  ins(table, row){ return this.rest('POST', table, row, 'return=representation'); },
  upd(table, filter, patch){ return this.rest('PATCH', table+'?'+filter, patch, 'return=representation'); },
  del(table, filter){ return this.rest('DELETE', table+'?'+filter, undefined, 'return=minimal'); },
  rpc(fn, args){ return this.rest('POST', 'rpc/'+fn, args||{}); },
  async upload(path, blob){
    const tk = await this.token();
    return this.call('/storage/v1/object/media/'+encPath(path), {method:'POST', headers:{apikey:this.key, Authorization:'Bearer '+tk, 'Content-Type':blob.type||'application/octet-stream', 'cache-control':'max-age=31536000', 'x-upsert':'false'}, body:blob});
  },
  async removeFile(path){
    const tk = await this.token();
    return this.call('/storage/v1/object/media/'+encPath(path), {method:'DELETE', headers:{apikey:this.key, Authorization:'Bearer '+tk}});
  },
  pub(path){ return this.url + '/storage/v1/object/public/media/' + encPath(path); }
};
function encPath(p){ return String(p).split('/').map(encodeURIComponent).join('/'); }
function errMsg(e){
  const c = String(e && (e.error_code || e.code || e.error) || ''), m = String(e && (e.message || e.msg || e.error_description) || '');
  const map = {not_enough_units:'err_units', duplicate_request:'err_dup', rating_window_closed:'err_window', already_rated:'err_already', reason_required:'reason_required', comment_too_short:'min_comment', invalid_scores:'rate_all', gender_mismatch:'gender_mismatch', listing_unavailable:'full_now', invalid_credentials:'err_creds', invalid_grant:'err_creds', user_already_exists:'err_exists', email_exists:'err_exists', weak_password:'err_weak', email_address_invalid:'err_email', over_request_rate_limit:'err_rate', over_email_send_rate_limit:'err_email_limit', tenants_only:'not_open_host', daily_limit:'ai_limit', ai_not_configured:'ai_unavailable', ai_failed:'ai_unavailable', email_not_confirmed:'err_confirm', confirm_email:'err_confirm', network:'err_net', session_expired:'session_expired'};
  for(const k in map){ if(c===k || m.indexOf(k)>=0) return t(map[k]); }
  if(/invalid login/i.test(m)) return t('err_creds');
  if(/already registered/i.test(m)) return t('err_exists');
  if(/password should be|weak/i.test(m)) return t('err_weak');
  if(/email not confirmed/i.test(m)) return t('err_confirm');
  if(/invalid format|validate email|email address .*invalid/i.test(m)) return t('err_email');
  if(/rate limit|too many/i.test(m)) return t('err_rate');
  if(c==='23505') return t('err_already');
  return t('err_generic', {m: m || c || '?'});
}

function emptyState(){ return {users:[], listings:[], bookings:[], reviews:[], searches:[], saved:{}, stats:{}, contacts:{}, userId:null, loaded:false}; }
let SYNCING = null;
async function sync(){
  if(SYNCING) return SYNCING;
  SYNCING = (async()=>{
    try{
      const uid = API.uid();
      const [profiles, listings, bookings, reviews, saved, stats, contacts] = await Promise.all([
        API.get('profiles?select=*'),
        API.get('listings?select=*&order=created_at.desc'),
        API.get('bookings?select=*&order=created_at.desc'),
        API.get('reviews?select=*&order=created_at.desc'),
        API.get('saved?select=listing'),
        API.rpc('user_stats_list',{}).catch(()=>API.get('user_stats?select=*')),
        API.get('contacts?select=*')
      ]);
      const mine = profiles.find(p=>p.id===uid);
      let searches = [];
      if(mine && mine.role==='host'){
        const since = new Date(Date.now()-30*DAY).toISOString();
        searches = (await API.get('searches?select=city,type,budget,nat,amen,who,workers,created_at&created_at=gte.'+encodeURIComponent(since)+'&order=created_at.desc&limit=3000'))
          .map(s=>({city:s.city, type:s.type, budget:+s.budget||0, nat:s.nat, amen:s.amen||[], who:s.who, workers:+s.workers||0, ts:new Date(s.created_at).getTime()}));
      }
      S.users = profiles.map(mapProfile);
      S.listings = listings.map(mapListing);
      S.bookings = bookings.map(mapBooking);
      S.reviews = reviews.map(mapReview);
      S.saved = {}; S.saved[uid] = saved.map(x=>x.listing);
      S.stats = {}; stats.forEach(x=>{ S.stats[x.user_id] = x; });
      S.contacts = {}; contacts.forEach(x=>{ S.contacts[x.id] = x.phone; });
      S.searches = searches;
      S.userId = mine ? uid : null;
      S.loaded = true;
      autoReveal();
      RV++;
      return !!mine;
    } finally { SYNCING = null; }
  })();
  return SYNCING;
}

function matchCompany(l,u){ const p=u.prefs||{}, need=Math.max(1,+u.workforce||1), b=p.budget||450;

/* ================= ratings & trust ================= */
const PRIOR = 3.6, PW = 4;
function ratingOf(kind, id){ return memo('r:'+kind+':'+id, ()=>{
  let rs;
  if(kind==='listing') rs = S.reviews.filter(r=>r.revealed && r.kind==='w2h' && r.listing===id);
  else if(kind==='host') rs = S.reviews.filter(r=>r.revealed && r.kind==='w2h' && r.to===id);
  else rs = S.reviews.filter(r=>r.revealed && r.kind==='h2w' && r.to===id);
  const n = rs.length, sum = rs.reduce((a,r)=>a+r.overall,0);
  const keys = kind==='worker'?H2W:W2H, crit = {};
  keys.forEach(k=>{ crit[k] = n ? rs.reduce((a,r)=>a+(r.sc[k]||0),0)/n : 0; });
  return {n, avg:n?sum/n:0, bayes:(PRIOR*PW+sum)/(PW+n), crit, list:rs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))};
}); }
function isPaused(l){ const r = ratingOf('listing', l.id); return r.n>=5 && r.bayes<2.5; }
function stat(id){ return S.stats[id] || {stays:0,requests:0,answered:0}; }

function payRate(wid){ const rs = S.reviews.filter(r=>r.revealed && r.kind==='h2w' && r.to===wid); if(!rs.length) return null; return Math.round(rs.filter(r=>r.sc.pay>=4).length/rs.length*100); }

function trustWorker(u){ const r=ratingOf('worker',u.id), pay=payRate(u.id); return Math.round((r.bayes/5)*60 + (u.verified?10:0) + Math.min(completedStays(u.id),5)/5*20 + (pay==null?5:pay/100*10)); }
function trustHost(h){ const r=ratingOf('host',h.id); const ls=S.listings.filter(l=>l.host===h.id&&live(l)); const resp=hostResp(h.id); const lic=ls.length?ls.filter(l=>l.licensed).length/ls.length:0; return Math.round((r.bayes/5)*60 + lic*10 + (resp==null?80:resp)/100*20 + Math.min(monthsSince(h.joined),24)/24*10); }
function hasRated(b,kind){ return S.reviews.some(r=>r.booking===b.id && r.kind===kind); }

function rateOpen(b){ return b.status==='completed' && b.endedAt && Date.now()-new Date(b.endedAt) < 14*DAY; }
function autoReveal(){ const now=Date.now(); S.reviews.forEach(r=>{ if(!r.revealed){ const o=S.reviews.find(x=>x.booking===r.booking && x.kind!==r.kind); if(o || now-new Date(r.date)>14*DAY){ r.revealed=true; if(o) o.revealed=true; } } }); }

/* ================= smart analysis ================= */
function marketRef(city,type,exclude){ return memo('mk:'+city+':'+type+':'+(exclude||''), ()=>{
  const ps = S.listings.filter(x=>live(x) && x.city===city && x.type===type && x.id!==exclude).map(x=>x.price).sort((a,b)=>a-b);
  if(ps.length>=3){ const mid=Math.floor(ps.length/2); return {m: ps.length%2?ps[mid]:(ps[mid-1]+ps[mid])/2, est:false}; }
  return {m: MARKET[city][type], est:true};
}); }
function priceTag(l){ const mr=refPrice(l), r=l.price/mr.m; return {m:mr.m, est:mr.est, r, k: r<0.6?'sus':(r<0.92?'good':(r<=1.1?'fair':'high'))}; }
function priceTagPill(pt){ return pt.k==='sus'?`<span class="pill bad">${ic('alert',13)}${t('sus_short')}</span>`:pt.k==='good'?`<span class="pill good">${t('good_deal')}</span>`:pt.k==='fair'?`<span class="pill palm">${t('fair_price')}</span>`:`<span class="pill warn">${t('pricey')}</span>`; }
function genderOK(l,u){ return l.gender==='family' || (l.gender==='men' && u.gender!=='f') || (l.gender==='women' && u.gender==='f'); }
function matchScore(l,u){ if(isCo(u)) return matchCompany(l,u); const p=u.prefs||{}; return memo('m:'+l.id+':'+u.id+':'+p.city+':'+p.budget+':'+(p.amen||[]).join(','), ()=>{
  const reasons=[]; let s=0; const b=p.budget||600;
  if(l.price<=b){ s+=35; reasons.push({k:'ok',t:t('in_budget',{b:money(b)})}); }
  else { const over=l.price-b; s+=Math.max(0,35-over/b*100); reasons.push({k:'no',t:t('over_budget',{n:money(over)})}); }
  const nearTxt = l.near && (l.near.ar||l.near.en) ? ' · '+t('km_to',{n:l.near.km,p:esc(pn(l.near))}) : '';
  if(!p.city || l.city===p.city){ s+=20; reasons.push({k:'ok',t:t('in_city')+nearTxt}); }
  else reasons.push({k:'no',t:t('other_city')});
  const want=p.amen||[], have=want.filter(a=>l.amen.includes(a));
  if(want.length){ s+=have.length/want.length*20; reasons.push({k:have.length===want.length?'ok':'no',t:t('has_wanted',{n:have.length,m:want.length})}); } else s+=14;
  if(u.lang && l.langs.includes(u.lang)){ s+=10; reasons.push({k:'ok',t:t('same_lang',{l:LANG_NAMES[u.lang]})}); } else reasons.push({k:'no',t:t('no_same_lang')});
  const r=ratingOf('listing',l.id); s += r.n ? r.bayes/5*10 : 6; if(l.licensed) s+=5;
  const gOK = genderOK(l,u);
  if(!gOK){ s*=0.2; reasons.unshift({k:'bad',t:l.gender==='women'?t('only_women'):t('only_men')}); }
  if(l.free===0) s*=0.7;
  return {score:Math.round(Math.min(100,s)), reasons, gOK};
}); }
function suggestedPrice(l){ const base=refPrice(l).m, adj=(l.amen.length-6)*0.015, r10=x=>Math.round(x/10)*10; return {lo:r10(base*(0.94+adj)), hi:r10(base*(1.06+adj))}; }
function demand(cities){ return memo('d:'+cities.join(','), ()=>{
  const since = Date.now()-30*DAY;
  const ss = S.searches.filter(x=>x.ts>=since && (!cities.length || cities.includes(x.city))); const N = ss.length||1;
  const cnt = f=>{ const o={}; ss.forEach(x=>[].concat(f(x)).forEach(k=>{ if(k) o[k]=(o[k]||0)+1; })); return Object.entries(o).map(([k,v])=>({k,v,p:Math.round(v/N*100)})).sort((a,b)=>b.v-a.v); };
  const bands=[]; for(let lo=200; lo<800; lo+=100) bands.push({lo,hi:lo+100,v:0});
  ss.filter(x=>x.type==='bed'||x.type==='compound').forEach(x=>{ bands[clamp(Math.floor((x.budget-200)/100),0,bands.length-1)].v++; });
  const co=ss.filter(x=>x.who==='company'), coW=co.length?Math.round(co.reduce((a,x)=>a+(+x.workers||0),0)/co.length):0;
  return {coN:co.length, coW, n:ss.length, nat:cnt(x=>x.nat).filter(x=>NATS.includes(x.k)), type:cnt(x=>x.type).filter(x=>TYPES.includes(x.k)), amen:cnt(x=>x.amen).filter(x=>AMEN.includes(x.k)), bands};
}); }
function quality(l){
  const tips=[]; let s=0;
  const photos=l.media.filter(m=>m.kind!=='vid').length, vid=l.media.some(m=>m.kind==='vid');
  s+=Math.min(photos,5)/5*25; if(photos<5) tips.push(t('tip_photos',{n:5-photos}));
  if(vid) s+=15; else tips.push(t('tip_video'));
  const dlen=Math.max((l.desc.ar||'').length,(l.desc.en||'').length); s+=Math.min(dlen/200,1)*15; if(dlen<120) tips.push(t('tip_desc'));
  s+=Math.min(l.amen.length/8,1)*15;
  if(l.licensed) s+=10; else tips.push(t('tip_license'));
  if(l.price>0){ const sp=suggestedPrice(l); if(l.price<=sp.hi*1.02) s+=10; else { s+=3; tips.push(t('tip_price_high')); } }
  if(l.langs.length) s+=5; else tips.push(t('tip_langs'));
  if(l.rules.length) s+=5;
  const d = demand([l.city]);
  const top = d.n>=5 ? d.amen.find(a=>!l.amen.includes(a.k) && a.p>=35) : null;
  if(top) tips.push(t('tip_amen',{c:t('c_'+l.city),a:t('a_'+top.k)}));
  return {score:Math.round(s), tips};
}

/* ================= filtering ================= */
function filtered(f,type,q){
  f=f||UI.f; type=type||UI.type; q=norm(q==null?UI.q:q).trim();
  return S.listings.filter(l=>{
    if(!live(l) || isPaused(l)) return false;
    if(l.type==='building' && !isCo(me()) && type!=='building') return false;
    if(type!=='all' && l.type!==type) return false;
    if(f.city && l.city!==f.city) return false;
    if(f.max && l.price>f.max) return false;
    if(f.gender!=='any' && l.gender!==f.gender) return false;
    if(f.amen.length && !f.amen.every(a=>l.amen.includes(a))) return false;
    if(f.licensed && !l.licensed) return false;
    if(f.rating4){ const r=ratingOf('listing',l.id); if(!r.n || r.bayes<4) return false; }
    if(q){ const hay=norm([l.name.ar,l.name.en,l.district,T['c_'+l.city].join(' ')].join(' ')); if(!hay.includes(q)) return false; }
    return true;
  });
}
function sortList(list){ const u=me(), a=list.slice();
  if(UI.sort==='price') a.sort((x,y)=>x.price-y.price);
  else if(UI.sort==='rating') a.sort((x,y)=>ratingOf('listing',y.id).bayes-ratingOf('listing',x.id).bayes);
  else if(isTenant(u)) a.sort((x,y)=>matchScore(y,u).score-matchScore(x,u).score);
  return a; }
function filterCount(f){ f=f||UI.f; return (f.city?1:0)+(f.max?1:0)+(f.gender!=='any'?1:0)+f.amen.length+(f.licensed?1:0)+(f.rating4?1:0); }
let LAST_SEARCH = {k:'',ts:0};
function logSearch(){ const u=me(); if(!isTenant(u)) return; const f=UI.f, p=u.prefs||{};
  const row={city:f.city||p.city||'riyadh',type:UI.type!=='all'?UI.type:(isCo(u)?'compound':'bed'),budget:f.max||p.budget||500,nat:u.nat||null,amen:(f.amen.length?f.amen:(p.amen||[])).slice(),who:u.role,workers:isCo(u)?(+u.workforce||null):null};
  const k=JSON.stringify(row); if(k===LAST_SEARCH.k && Date.now()-LAST_SEARCH.ts<60000) return; LAST_SEARCH={k,ts:Date.now()};
  API.rest('POST','searches',row,'return=minimal').catch(()=>{}); }

async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; });
    const max=1280, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)), w=Math.round(img.naturalWidth*sc), h=Math.round(img.naturalHeight*sc);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
    const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',0.8)); return blob||file;
  }catch(e){ return file; } finally{ URL.revokeObjectURL(url); }
}

      else { if(imgs>=10){ toast(t('media_limit')); continue; } imgs++; }
      const blob = isI ? await compressImage(f) : f;
      const ext = isI ? (blob.type==='image/jpeg'?'jpg':((blob.type.split('/')[1]||'jpg').replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg')) : ((f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'mp4');
      const path = S.userId+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.'+ext;
      const item = {kind:isV?'vid':'img', path, local:URL.createObjectURL(blob), up:true};
      d.media.push(item); d.uploading++; render();
      API.upload(path, blob)
        .then(()=>{ item.up=false; if(item.cancel) API.removeFile(path).catch(()=>{}); else d._new.push(path); })
        .catch(e=>{ const i=d.media.indexOf(item); if(i>=0) d.media.splice(i,1); toast(t('upload_fail')+' · '+errMsg(e)); })
        .finally(()=>{ d.uploading=Math.max(0,d.uploading-1); if(UI.page&&UI.page.d===d) render(); });
    }
  }
};

/* ================= wiring ================= */
document.addEventListener('click', e=>{ const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a, fn=A[a]; if(!fn||el.disabled) return;
  if(a==='scrim'){ if(e.target===el) A.closeSheet(); return; }
  if(el.tagName==='A') e.preventDefault();
  fn(el,e); });
document.addEventListener('submit', e=>{ const f=e.target; e.preventDefault(); const a=f.dataset&&f.dataset.submit; if(a&&A[a]) A[a](f,e); });
document.addEventListener('input', e=>{ const el=e.target; const k=el.dataset&&el.dataset.in; if(k&&IN[k]) IN[k](el,e); });
document.addEventListener('change', e=>{ const el=e.target; const k=el.dataset&&el.dataset.ch; if(k&&CH[k]) CH[k](el,e); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && UI.sheet){ A.closeSheet(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('[data-a][role="link"]')){ e.preventDefault(); e.target.click(); }
});

/* keep data fresh while friends use it at the same time */
function canAutoSync(){
  if(document.visibilityState!=='visible' || !S.userId || UI.busy || UI.view) return false;
  if(UI.sheet || UI.page) return false;
  const ae=document.activeElement; if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return false;
  return true;
}
function quietSync(){ if(!canAutoSync()) return; sync().then(()=>{ if(canAutoSync()) render(); }).catch(e=>{ if(e && e.code==='session_expired') toLoggedOut(t('session_expired')); }); }
setInterval(quietSync, 30000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') quietSync(); });

function initAI(){ AIX.init(); }
async function loadAll(){
  UI.loadErr=null; UI.view='loading'; render();
  try{
    const has=await sync();
    if(has){ UI.view=null; } else { UI.reg=regDefaults('worker'); UI.reg.complete=true; UI.view='register'; }
  }catch(e){
    if(e && e.code==='session_expired'){ toLoggedOut(t('session_expired')); return; }
    UI.loadErr=errMsg(e);
  }
  render();
}
function boot(){
  LANG = loadLang() || guessLang(); if(!(LANG in LI)) LANG='ar';
  if(!API.ready()){ UI.view='setup'; render(); return; }
  API.loadSession();
  if(API.session) loadAll(); else { UI.view='welcome'; render(); }
  initAI();
}
boot();

</script>
